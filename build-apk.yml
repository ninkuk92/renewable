name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "RenewableEnergyExamApp_v2.5.0_REAL_ONLY_TABLET_SOURCE.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract app source
        run: unzip -q RenewableEnergyExamApp_v2.5.0_REAL_ONLY_TABLET_SOURCE.zip -d unpacked

      - name: Create Android project
        run: |
          flutter create --platforms=android --org com.renewableexam --project-name renewable_exam_app generated_project
          cp unpacked/RenewableEnergyExamApp_v2.5.0_REAL_ONLY_TABLET_SOURCE/source/pubspec.yaml generated_project/pubspec.yaml
          cp unpacked/RenewableEnergyExamApp_v2.5.0_REAL_ONLY_TABLET_SOURCE/source/analysis_options.yaml generated_project/analysis_options.yaml
          rm -rf generated_project/lib generated_project/assets generated_project/test
          cp -R unpacked/RenewableEnergyExamApp_v2.5.0_REAL_ONLY_TABLET_SOURCE/source/lib generated_project/lib
          cp -R unpacked/RenewableEnergyExamApp_v2.5.0_REAL_ONLY_TABLET_SOURCE/source/assets generated_project/assets
          python3 - <<'PY'
          from pathlib import Path
          p = Path("generated_project/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<manifest", '<manifest', 1)
              i = s.find(">")
              s = s[:i+1] + '\n    <uses-permission android:name="android.permission.INTERNET" />' + s[i+1:]
          import re
          s = re.sub(r'android:label="[^"]*"', 'android:label="신재생에너지 기사 CBT"', s)
          p.write_text(s)
          PY

      - name: Get packages
        working-directory: generated_project
        run: flutter pub get

      - name: Analyze
        working-directory: generated_project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: generated_project
        run: flutter build apk --release

      - name: Rename APK
        run: cp generated_project/build/app/outputs/flutter-apk/app-release.apk RenewableEnergyExam_v2.5.0_REAL_ONLY_TABLET.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RenewableEnergyExam-v2.5.0-APK
          path: RenewableEnergyExam_v2.5.0_REAL_ONLY_TABLET.apk
          retention-days: 30

